# Z2M action format:  <command>_<scene_id>
# Examples:
#   on_1, off_2
#   brightness_step_up_3, brightness_step_down_4
#   color_temperature_step_up_1  (fire)
#   color_temperature_move_2     (skip/neutral)
#   color_temperature_step_down_3 (snow)
#   hue_move_1                   (repeat)
#   move_to_saturation_2         (color wheel button)
#   move_to_hue_and_saturation_3 (color wheel movement)
#   recall_1_1 … recall_7_4      (scene_number _ scene_id)

trigger:
  - platform: mqtt
    topic: !input "mqtt_topic"

action:
  - condition: template
    value_template: "{{ trigger.payload_json.action is defined }}"

  - variables:
      action: "{{ trigger.payload_json.action }}"
      # Last character is the scene/endpoint id (1-4)
      scene_id: "{{ action[-1] | int(0) }}"
      # Everything before the trailing _N is the command name
      command_name: "{{ action[:-2] }}"

  - choose:

      # ── Scene 1 ───────────────────────────────────────────────────────────

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'off' }}"
        sequence: !input "sc1_power_off"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'on' }}"
        sequence: !input "sc1_power_on"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'brightness_step_down' }}"
        sequence:
          - variables:
              sc1_brightness_step: !input "sc1_brightness_step"
          - action: light.turn_on
            target: !input "sc1_brightness_target"
            data:
              brightness_step_pct: "{{ -1 * (sc1_brightness_step | int(10)) }}"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'brightness_step_up' }}"
        sequence:
          - variables:
              sc1_brightness_step: !input "sc1_brightness_step"
          - action: light.turn_on
            target: !input "sc1_brightness_target"
            data:
              brightness_step_pct: "{{ sc1_brightness_step | int(10) }}"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'color_temperature_step_up' }}"
        sequence: !input "sc1_fire"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'color_temperature_move' }}"
        sequence: !input "sc1_skip"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'color_temperature_step_down' }}"
        sequence: !input "sc1_snow"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and action.startswith('recall_1_') }}"
        sequence: !input "sc1_s1"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and action.startswith('recall_2_') }}"
        sequence: !input "sc1_s2"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and action.startswith('recall_3_') }}"
        sequence: !input "sc1_s3"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and action.startswith('recall_4_') }}"
        sequence: !input "sc1_s4"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and action.startswith('recall_5_') }}"
        sequence: !input "sc1_s5"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and action.startswith('recall_6_') }}"
        sequence: !input "sc1_s6"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and action.startswith('recall_7_') }}"
        sequence: !input "sc1_s7"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'hue_move' }}"
        sequence: !input "sc1_repeat"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'move_to_saturation' }}"
        sequence: !input "sc1_color_wheel_button"

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 1 and command_name == 'move_to_hue_and_saturation' }}"
        sequence:
          - variables:
              light: !input "sc1_color_wheel_light"
              do_it_anyway: !input "sc1_color_wheel_on_if_off"
          - if:
              - condition: template
                value_template: "{{ do_it_anyway or is_state(light, 'on') }}"
            then:
              - action: light.turn_on
                target:
                  entity_id: !input "sc1_color_wheel_light"
                data:
                  hs_color:
                    - "{{ trigger.payload_json.action_hue / 255 * 360 }}"
                    - !input "sc1_color_wheel_saturation"

      # ── Scene 2 ───────────────────────────────────────────────────────────

      - conditions:
          - condition: template
            value_template: "{{ scene_id == 2 and command_name == 'off' }}"
        sequence: !input "sc2_power_off"

      - conditions:
