# Paulmann Gent 2 Blueprint for Home Assistant
# Version 1.0.0.0
# Ported from ZHA to Zigbee2MQTT
# Original ZHA Blueprint by IceBeach7
# https://github.com/IceBeach7/HASS-Paulmann-Gent-2

blueprint:
  domain: automation
  name: "Paulmann Gent 2 (501.40) - Zigbee2MQTT"
  description: "<h1>Paulmann Gent 2 RGB Remote Home Assistant Blueprint</h1>\n<p>This
    Home Assistant blueprint provides control of lights using a Paulmann Gent 2 RGB
    remote (and likely compatible Sunricher ZG2868 models) via Zigbee2MQTT. 
    This Blueprint is a Zigbee2MQTT Port of the ZHA Blueprint by IceBeach7 
    (see <a href=\"https://github.com/IceBeach7/HASS-Paulmann-Gent-2\">ZHA Blueprint by IceBeach7</a>)</p>\n<h2>Description</h2>\n<p>This
    blueprint leverages Zigbee2MQTT to receive commands from the Paulmann Gent 2 RGB
    remote and translate them into actions to control your lights in Home Assistant.
    It aims to support most of the remote's functionalities, offering a convenient
    way to interact with your smart lighting.</p>\n<p>The blueprint is designed primarily
    for RGB color lights but can be used with other types of lights, although some
    features may not be relevant or function as expected with non-RGB lighting.</p>\n<p><b>Important
    Considerations:</b></p>\n<ul>\n  <li><b>Zigbee2MQTT Requirement:</b> This blueprint
    requires you to be using Zigbee2MQTT to manage your Zigbee devices.</li>\n  <li><b>Remote
    Compatibility:</b> While designed for the Paulmann Gent 2 RGB remote (see <a href=\"https://en.paulmann.com/detail/d6cceca46d334842bd3bd2008204274c\">Paulmann
    Gent 2 RGB Remote</a>), it is believed to also be compatible with the Sunricher
    ZG2868 (see <a href=\"https://www.zigbee2mqtt.io/devices/501.40.html\">Zigbee2MQTT
    Device Page</a>). Ensure your remote is correctly paired with Zigbee2MQTT.</li>\n
    \ <li><b>Topic Configuration:</b> You will need to configure the correct MQTT
    topic for your remote in the blueprint inputs.</li>\n</ul>\n"

  input:
    mqtt_topic:
      name: "MQTT Topic"
      description: "The MQTT topic for the remote (usually zigbee2mqtt/{FRIENDLY_NAME})"
      default: "zigbee2mqtt/"
      selector:
        text:
          multiline: false
          multiple: false

    # ── Scene 1 ──────────────────────────────────────────────────────────────
    s1_section:
      name: "Scene 1"
      icon: mdi:numeric-1-box
      collapsed: true
      input:
        sc1_power_off:
          name: "⏻ Power - Off"
          selector:
            action: {}
          default: []

        sc1_power_on:
          name: "⏻ Power - On"
          selector:
            action: {}
          default: []

        sc1_brightness_target:
          name: "💡 Brightness - Light"
          description: "The light(s) to dim up/down with the brightness buttons."
          selector:
            target:
              entity:
                - domain: light
          default: {}

        sc1_brightness_step:
          name: "🎚️ Brightness - Step size (%)"
          description: "How many percent to change brightness per button press."
          selector:
            number:
              min: 1
              max: 50
              step: 1
              unit_of_measurement: "%"
          default: 10

        sc1_fire:
